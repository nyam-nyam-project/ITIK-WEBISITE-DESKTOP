name: Laravel CI/CD & Security Pipeline

on:
  push:
    branches: [ "main", "coba_cicd" ]
  pull_request:
    branches: [ "main", "coba_cicd" ]

jobs:
  build-and-test:
    name: Build, Test, and Cyber Security Scan
    runs-on: ubuntu-latest

    steps:
      # 1. Mengambil kode dari repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Menyiapkan environment PHP (Sesuaikan versi PHP dengan servermu, default Laravel 11 biasanya 8.2/8.3)
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, bcmath
          tools: composer:v2

      # 3. Menginstal dependensi backend (PHP/Laravel)
      - name: Install Composer Dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      # 4. Menginstal dependensi frontend (Node.js/Vite)
      - name: Install NPM Dependencies & Build Assets
        run: |
          npm install
          npm run build

      # 5. Menyiapkan konfigurasi environment (.env)
      - name: Prepare Laravel Environment
        run: |
          cp .env.example .env
          php artisan key:generate

      # 6. Menyiapkan Database SQLite untuk kebutuhan testing agar lebih ringan
      - name: Setup Database for Testing
        run: |
          touch database/database.sqlite
          sed -i 's/DB_CONNECTION=.*/DB_CONNECTION=sqlite/' .env
          sed -i 's/# DB_DATABASE=.*/DB_DATABASE='$(pwd)'\/database\/database.sqlite/' .env
          php artisan migrate --force

      # 7. Menjalankan Automated Testing (Unit & Feature Test Laravel)
      - name: Execute Tests (PHPUnit)
        run: php artisan test

      # 8. Cyber Security Scan (Mengecek kerentanan package pihak ketiga)
      - name: Security Vulnerability Checker
        run: |
          composer require --dev enlightn/security-checker
          php vendor/bin/security-checker security:check